name: agent
# dc-agent (agent-go/), the agent with nothing to install: checked against
# agent.py, installed against a real hub, then built for every system on a
# free Linux runner (Go cross-compiles; no cgo). A published release gets the
# binaries and their SHA256SUMS attached, and the hub's /dl/ points at them.
on:
  push:
    paths: ['agent-go/**', 'agent.py', 'push.py', 'hub.py', 'tests/test_go_agent.py', '.github/workflows/agent.yml']
  pull_request:
    paths: ['agent-go/**', 'agent.py', 'push.py', 'hub.py', 'tests/test_go_agent.py', '.github/workflows/agent.yml']
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only the release step uses it, to attach the binaries
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: agent-go/go.mod
          cache-dependency-path: agent-go/go.sum
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: vet and format
        working-directory: agent-go
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: the same report as agent.py, and an install against a real hub
        run: python -m unittest discover -s tests -p 'test_go_agent.py' -v
      - name: build for every system
        run: |
          set -euo pipefail
          v="$(python3 -c "import re; print(re.search(r\"VERSION = '([^']+)'\", open('hub.py').read()).group(1))")"
          mkdir -p dist/agent
          for t in linux/amd64 linux/arm64 linux/arm linux/386 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os="${t%/*}"; arch="${t#*/}"; ext=""
            [ "$os" = windows ] && ext=.exe
            # GOARM=7: LibreELEC and NAS boxes on 32-bit ARM (a Pi 2 or 3 running a 32-bit system)
            (cd agent-go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7 \
              go build -trimpath -ldflags "-s -w -X main.Version=$v" -o "../dist/agent/dc-agent-$os-$arch$ext" .)
          done
          cd dist/agent && sha256sum dc-agent-* > SHA256SUMS && ls -la
      - name: a built one runs and says its version
        run: dist/agent/dc-agent-linux-amd64 version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dc-agent
          path: dist/agent/
          retention-days: 14
      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/agent/* --clobber --repo "$GITHUB_REPOSITORY"
