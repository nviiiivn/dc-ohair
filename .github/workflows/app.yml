name: app
# Builds the phone app on GitHub's free runners: an Android APK, and an
# unsigned iOS IPA for AltStore or Sideloadly to sign with your own Apple ID.
# A published release gets both attached; running it by hand just keeps them
# as build artifacts.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
env:
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1
jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write  # to attach the files to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            runner: ubuntu-latest
          - target: ipa
            runner: macos-26
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install flet-cli==1.0.4
      - run: python app/sync.py
      - name: flet build ${{ matrix.target }}
        working-directory: app
        run: |
          version=()
          if [ -n "$TAG" ]; then version=(--build-version "${TAG#v}"); fi
          flet build ${{ matrix.target }} --yes --verbose --build-number "$GITHUB_RUN_NUMBER" "${version[@]}"
      - name: name the files
        run: |
          name="dc-ohair-${TAG:-build-$GITHUB_RUN_NUMBER}"
          mkdir dist
          if [ "${{ matrix.target }}" = apk ]; then
            cp "$(ls app/build/apk/*.apk | head -1)" "dist/$name.apk"
          else
            # unsigned builds stop at an .xcarchive; an IPA is just its .app in a Payload folder
            app=$(find app/build/ipa -path '*Products/Applications/*.app' -maxdepth 6 -type d | head -1)
            mkdir Payload && cp -R "$app" Payload/
            zip -qry "dist/$name-unsigned.ipa" Payload
          fi
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
