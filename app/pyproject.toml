# The Disk City phone and tablet app, built with Flet.
#   python sync.py            # copy the hub's shared Python into src/shared
#   flet run src/main.py      # try it on this computer
#   flet build apk            # Android (see README.md for iOS)
#
# No [project.dependencies] on purpose: flet build falls back to
# requirements.txt, which is the list kept current.

[project]
name = "dc-ohair"
version = "0.1.0"
description = "Your Disk City disk city, on your phone"
requires-python = ">=3.10"

[tool.flet]
product = "Disk City"
org = "io.github.nviiiivn"
bundle_id = "io.github.nviiiivn.dcohair"
company = "Disk City contributors"
copyright = "Copyright 2026 the Disk City contributors"

[tool.flet.app]
path = "src"
module = "main"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
# "Scan this phone" measures every file, so it asks for All files access (sideloaded builds)
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true

# hubs usually answer on plain http on the home network, and with no hub the
# City tab is served by the app itself on 127.0.0.1
[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.ios.info]
NSAppTransportSecurity = { NSAllowsLocalNetworking = true }
NSLocalNetworkUsageDescription = "Disk City talks to your hub and computers on your home network."
